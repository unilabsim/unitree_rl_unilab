[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "unitree-rl-unilab"
version = "0.1.0"
description = "Unitree production tasks for the UniLab Manager-Based runtime"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "UniLab contributors" }]
dependencies = [
    # Coordinated baseline from UniLab discussion #1576.  The MuJoCo extra is
    # the minimum backend needed by every task family migrated here; Motrix,
    # Drake, and other backend extras remain task-owner choices.
    "unilab[mujoco]==1.3.0",
    "unilab-rl==1.2.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
motrix = ["unilab[motrix]==1.3.0"]
drake = ["unilab[drake]==1.3.0"]
mjwarp = ["unilab[mjwarp]==1.3.0"]

[project.scripts]
unitree-rl = "unitree_rl_unilab.cli:main"

[project.entry-points."unilab.tasks"]
unitree = "unitree_rl_unilab.tasks"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14", "mypy>=1.16", "types-PyYAML"]

[tool.hatch.build.targets.wheel]
packages = ["src/unitree_rl_unilab"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "N806", "N801", "N802", "N803", "N812"]

[tool.mypy]
# NumPy's installed stubs use `type` statements that require this parser
# version even though the runtime package remains compatible with Python 3.10.
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
